{% set version = "1.0.1" %}
{% set python_min = "3.9" %}

package:
  name: mkgraticule-planet
  version: {{ version }}

source:
  url: https://github.com/ryodohemmi/mkgraticule_planet/archive/refs/tags/v{{ version }}.tar.gz
  sha256: d608a0b075226390d36093c4125817f706986edabf53bfa13e43ffada51d591b

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - mkgraticule = mkgraticule_planet.cli:main
    - mkgraticule_planet = mkgraticule_planet.cli:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=68.0
  run:
    - python >={{ python_min }}
    - numpy
    - gdal

test:
  requires:
    - python {{ python_min }}
  imports:
    - mkgraticule_planet
  commands:
    - mkgraticule --help
    - mkgraticule_planet --version
    - mkgraticule_planet --help

about:
  home: https://github.com/ryodohemmi/mkgraticule_planet
  summary: Create planetary-scale graticules with multi-format labels for any GDAL/PROJ-supported CRS — exported as GeoPackage or SpatiaLite
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ryodohemmi
